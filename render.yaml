services:
  - type: web
    name: b2b-ar-collections-staging-web
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run docker-start
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    preDeployCommand: npm run release:gate
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-ar-collections-staging-db
          property: connectionString
      - key: DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY_ID
        value: staging-v1
      - key: PRIVACY_TOMBSTONE_KEY
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_all_orders,read_payment_terms,read_customers
      - key: SHOPIFY_PARTNER_ORGANIZATION_ID
        sync: false
      - key: SHOPIFY_PARTNER_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_PARTNER_APP_GID
        sync: false
      - key: SHOPIFY_APP_HANDLE
        sync: false
      - key: SHOPIFY_PLAN_HANDLE_FREE
        value: free
      - key: SHOPIFY_PLAN_HANDLE_STARTER
        value: starter
      - key: SHOPIFY_PLAN_HANDLE_GROWTH
        value: growth
      - key: SHOPIFY_PLAN_HANDLE_SCALE
        value: scale
      - key: SHOPIFY_PLAN_HANDLE_TEST
        value: private-test
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: POSTMARK_MESSAGE_STREAM
        value: b2b-ar-staging
      - key: POSTMARK_WEBHOOK_TOKEN
        generateValue: true
      - key: RELEASE_VERSION
        sync: false

  - type: worker
    name: b2b-ar-collections-staging-worker
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker
    autoDeployTrigger: off
    preDeployCommand: npm run deployment:preflight && npm exec prisma migrate status
    maxShutdownDelaySeconds: 45
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-ar-collections-staging-db
          property: connectionString
      - key: DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SCOPES
        value: read_orders,read_all_orders,read_payment_terms,read_customers
      - key: SHOPIFY_PLAN_HANDLE_FREE
        value: free
      - key: SHOPIFY_PLAN_HANDLE_STARTER
        value: starter
      - key: SHOPIFY_PLAN_HANDLE_GROWTH
        value: growth
      - key: SHOPIFY_PLAN_HANDLE_SCALE
        value: scale
      - key: SHOPIFY_PLAN_HANDLE_TEST
        value: private-test
      - key: POSTMARK_MESSAGE_STREAM
        value: b2b-ar-staging
      - key: SESSION_ENCRYPTION_KEY
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SESSION_ENCRYPTION_KEY
      - key: SESSION_ENCRYPTION_KEY_ID
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SESSION_ENCRYPTION_KEY_ID
      - key: PRIVACY_TOMBSTONE_KEY
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: PRIVACY_TOMBSTONE_KEY
      - key: SHOPIFY_API_KEY
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_API_KEY
      - key: SHOPIFY_API_SECRET
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_API_SECRET
      - key: SHOPIFY_APP_URL
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_APP_URL
      - key: SHOPIFY_PARTNER_ORGANIZATION_ID
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_PARTNER_ORGANIZATION_ID
      - key: SHOPIFY_PARTNER_ACCESS_TOKEN
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_PARTNER_ACCESS_TOKEN
      - key: SHOPIFY_PARTNER_APP_GID
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_PARTNER_APP_GID
      - key: SHOPIFY_APP_HANDLE
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: SHOPIFY_APP_HANDLE
      - key: POSTMARK_SERVER_TOKEN
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: POSTMARK_SERVER_TOKEN
      - key: POSTMARK_FROM_EMAIL
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: POSTMARK_FROM_EMAIL
      - key: POSTMARK_WEBHOOK_TOKEN
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: POSTMARK_WEBHOOK_TOKEN
      - key: RELEASE_VERSION
        fromService:
          type: web
          name: b2b-ar-collections-staging-web
          envVarKey: RELEASE_VERSION

databases:
  - name: b2b-ar-collections-staging-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: b2b_ar_collections_staging
    user: b2b_ar_staging
    diskSizeGB: 15
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
